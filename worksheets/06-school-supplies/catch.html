<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>学校文具汉字接接乐 · Read and Roll</title>
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('preview')</script>
  <style>
    :root{--ink:#173052;--coral:#f17c67;--paper:#fffaf1;--muted:#68788c;--sky:#eaf7ff;--green:#e8f7df;--red:#fff0ee}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Microsoft YaHei",system-ui,sans-serif}.shell{width:min(930px,calc(100% - 28px));margin:auto;padding:22px 0 45px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.back{color:var(--muted);text-decoration:none;font-size:14px}.stats{display:flex;gap:7px}.badge{padding:8px 11px;border:1px solid #e3ddd1;border-radius:999px;background:#fff;font-size:13px;font-weight:700}.hero{margin:25px 0 17px;text-align:center}.eyebrow{margin:0 0 6px;color:var(--coral);font-size:11px;font-weight:800;letter-spacing:.18em}.hero h1{margin:0;font-size:clamp(30px,5vw,47px);letter-spacing:-.04em}.hero p{margin:8px 0 0;color:var(--muted)}.toolbar{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:13px}.toolbar span{color:var(--muted);font-size:12px;font-weight:700}.mode{padding:8px 13px;border:1px solid #cdd8e1;border-radius:999px;color:var(--ink);background:#fff;cursor:pointer;font-weight:700}.mode.active{border-color:var(--ink);color:#fff;background:var(--ink)}.game{overflow:hidden;border:1px solid #d7e4ec;border-radius:20px;background:#fff;box-shadow:0 18px 45px #27344113}.stage{position:relative;height:520px;overflow:hidden;background:linear-gradient(#e9f7ff 0%,#f9fdff 69%,#f4e6be 69%,#f7edcf 100%)}.cloud{position:absolute;color:#fff;font-size:58px;opacity:.9}.cloud.one{top:45px;left:8%}.cloud.two{top:115px;right:9%;font-size:43px}.falling{position:absolute;z-index:3;top:-82px;left:50%;display:grid;place-items:center;min-width:125px;height:70px;padding:0 18px;border:3px solid var(--coral);border-radius:16px;color:var(--ink);background:#fff;box-shadow:0 10px 20px #17305229;font-size:27px;font-weight:800;transform:translateX(-50%);transition:top 6s linear}.falling.drop{top:338px}.falling.caught{transition:.25s;transform:translateX(-50%) scale(.3);opacity:0}.falling.missed{border-color:#d96d64;background:var(--red)}.baskets{position:absolute;z-index:4;right:18px;bottom:18px;left:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.basket{position:relative;min-height:132px;padding:14px 10px 10px;border:3px solid #c78b4e;border-radius:12px 12px 25px 25px;color:var(--ink);background:repeating-linear-gradient(0deg,#efc07f 0 8px,#dda665 8px 12px);cursor:pointer;box-shadow:0 8px 13px #5e431d22;transition:.18s}.basket:before{content:"";position:absolute;top:-14px;left:12%;width:76%;height:30px;border:5px solid #a96d36;border-bottom:0;border-radius:50% 50% 0 0}.basket:hover{transform:translateY(-5px)}.basket.correct{border-color:#69a944;box-shadow:0 0 0 5px #84c45f55}.basket.wrong{border-color:#d35e55;animation:shake .3s}.basket-label{position:relative;z-index:1;display:grid;place-items:center;min-height:78px;padding:8px;border-radius:9px;background:#fffdf1e8;font-size:19px;font-weight:800}.basket-label.pinyin{font:800 18px "Trebuchet MS",sans-serif}.basket-label img{display:block;width:100%;height:72px;object-fit:contain;mix-blend-mode:multiply}.message{min-height:50px;padding:14px;color:var(--muted);background:#fff;text-align:center;font-size:14px;font-weight:700}.message.good{color:#447a2b;background:var(--green)}.message.bad{color:#a44a43;background:var(--red)}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.modal{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:20px;background:#172f526b}.modal[hidden]{display:none}.modal-card{width:min(470px,100%);padding:31px;border-radius:20px;background:#fff;text-align:center}.modal-card div{font-size:53px}.modal-card h2{margin:7px 0;font-size:30px}.modal-card p{color:var(--muted);line-height:1.7}.modal-card button{padding:13px 22px;border:0;border-radius:9px;color:#fff;background:var(--ink);cursor:pointer;font-weight:800}@media(max-width:620px){.stage{height:470px}.baskets{right:8px;left:8px;gap:6px}.basket{min-height:120px;padding:10px 5px 7px}.basket-label{font-size:15px}.basket-label.pinyin{font-size:13px}.basket-label img{height:62px}.falling.drop{top:296px}.stats{gap:3px}.badge{padding:7px 8px}.toolbar{flex-wrap:wrap}}
    .mode,.control{padding:8px 13px;border:1px solid #cdd8e1;border-radius:999px;color:var(--ink);background:#fff;cursor:pointer;font-weight:700}.control{border-color:var(--ink)}.control.primary{color:#fff;background:var(--ink)}.control:disabled{opacity:.4;cursor:not-allowed}
    html.preview .top,html.preview .hero{display:none}html.preview .shell{width:100%;padding:12px}html.preview .game{box-shadow:none}
  </style>
  <link rel="stylesheet" href="../../game-compact.css?v=2">
</head>
<body>
  <main class="shell"><div class="top"><a class="back" href="../../index.html#sheet-5">← 返回日常活动详情页</a><div class="stats"><span class="badge">得分 <b id="score">0</b></span><span class="badge">❤️ <b id="lives">5</b></span><span class="badge">第 <b id="round">0</b>/10题</span></div></div><header class="hero"><p class="eyebrow">CATCH THE WORD</p><h1>学校文具汉字接接乐</h1><p>看清掉落的汉字，点击正确的篮子把它接住！</p></header><div class="toolbar"><button class="control primary" id="start">开始游戏</button><button class="control" id="pause" disabled>暂停</button><span>篮子提示：</span><button class="mode active" data-mode="pinyin">拼音</button><button class="mode" data-mode="image">图片</button></div>
    <section class="game"><div class="stage" id="stage"><span class="cloud one">☁</span><span class="cloud two">☁</span><div class="baskets" id="baskets"></div></div><div class="message" id="message">准备好了吗？汉字马上掉下来！</div></section>
  </main>
  <div class="modal" id="finish" hidden><div class="modal-card"><div id="finish-icon">🏆</div><h2 id="finish-title">挑战完成！</h2><p id="result"></p><button id="restart">再玩一次</button></div></div>
  <script>
    const words=[
      {word:"橡皮",pinyin:"xiàng pí",img:"game-icons/eraser.png"},{word:"书",pinyin:"shū",img:"game-icons/book.png"},{word:"书包",pinyin:"shū bāo",img:"game-icons/bag.png"},{word:"电脑",pinyin:"diàn nǎo",img:"game-icons/computer.png"},{word:"椅子",pinyin:"yǐ zi",img:"game-icons/chair.png"},{word:"铅笔",pinyin:"qiān bǐ",img:"game-icons/pencil.png"},{word:"本子",pinyin:"běn zi",img:"game-icons/notebook.png"},{word:"桌子",pinyin:"zhuō zi",img:"game-icons/desk.png"}
    ];
    const shuffle=a=>[...a].sort(()=>Math.random()-.5);const previewMode=new URLSearchParams(location.search).has('preview');let deck=[],index=0,score=0,lives=5,mode='pinyin',current=null,options=[],falling=null,timer=null,locked=true,running=false,paused=false,remaining=6000,dropStartedAt=0,roundToken=0;const stage=document.querySelector('#stage'),baskets=document.querySelector('#baskets'),message=document.querySelector('#message'),startButton=document.querySelector('#start'),pauseButton=document.querySelector('#pause');
    function speak(text){if(previewMode||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.72;speechSynthesis.speak(u)}
    function start(){clearTimeout(timer);roundToken++;deck=shuffle(words).slice(0,10);index=0;score=0;lives=5;running=true;paused=false;locked=false;startButton.textContent='重新开始';pauseButton.disabled=false;pauseButton.textContent='暂停';document.querySelector('#finish').hidden=true;nextRound()}
    function nextRound(){if(!running)return;if(index>=deck.length||lives<=0){finish();return}const token=++roundToken;locked=false;paused=false;remaining=6000;current=deck[index];options=shuffle([current,...shuffle(words.filter(x=>x.word!==current.word)).slice(0,2)]);renderBaskets();falling?.remove();falling=document.createElement('div');falling.className='falling';falling.textContent=current.word;stage.append(falling);document.querySelector('#round').textContent=index+1;message.className='message';message.textContent='汉字正在掉落，快选择正确的篮子！';dropStartedAt=Date.now();requestAnimationFrame(()=>requestAnimationFrame(()=>{if(token!==roundToken)return;falling.style.transition='top 6s linear';falling.style.top='calc(100% - 182px)'}));timer=setTimeout(()=>miss(token),remaining);update()}
    function renderBaskets(){baskets.innerHTML=options.map((x,i)=>`<button class="basket" data-index="${i}" aria-label="${mode==='pinyin'?x.pinyin:x.word}"><span class="basket-label ${mode==='pinyin'?'pinyin':''}">${mode==='pinyin'?x.pinyin:`<img src="${x.img}" alt="图片选项">`}</span></button>`).join('');baskets.querySelectorAll('.basket').forEach(b=>b.addEventListener('click',()=>catchWord(b)))}
    function catchWord(button){if(locked||paused||!running)return;locked=true;clearTimeout(timer);const transitionToken=++roundToken;const picked=options[Number(button.dataset.index)];if(picked.word===current.word){score+=10;button.classList.add('correct');falling.classList.add('caught');message.className='message good';message.textContent=`接住了！${current.word} · ${current.pinyin}`;speak(current.word)}else{lives--;button.classList.add('wrong');const correctIndex=options.findIndex(x=>x.word===current.word);baskets.children[correctIndex].classList.add('correct');falling.classList.add('missed');message.className='message bad';message.textContent=`没有接对，正确答案是 ${current.pinyin}。`;speak(current.word)}update();index++;setTimeout(()=>{if(running&&roundToken===transitionToken)nextRound()},1250)}
    function miss(token){if(locked||paused||!running||token!==roundToken)return;locked=true;falling.classList.add('missed');const correctIndex=options.findIndex(x=>x.word===current.word);baskets.children[correctIndex].classList.add('correct');message.className='message bad';message.textContent=`汉字落地了，本题不扣红心。正确篮子是 ${current.pinyin}。`;speak(current.word);index++;setTimeout(()=>{if(running&&roundToken===token)nextRound()},1250)}
    function togglePause(){if(!running||locked)return;if(!paused){paused=true;clearTimeout(timer);remaining=Math.max(100,remaining-(Date.now()-dropStartedAt));const top=getComputedStyle(falling).top;falling.style.transition='none';falling.style.top=top;pauseButton.textContent='继续';message.className='message';message.textContent='游戏已暂停。'}else{paused=false;pauseButton.textContent='暂停';dropStartedAt=Date.now();const token=roundToken;requestAnimationFrame(()=>requestAnimationFrame(()=>{falling.style.transition=`top ${remaining}ms linear`;falling.style.top='calc(100% - 182px)'}));timer=setTimeout(()=>miss(token),remaining);message.textContent='继续游戏，快选择正确的篮子！'}}
    function update(){document.querySelector('#score').textContent=score;document.querySelector('#lives').textContent=lives}
    function finish(){clearTimeout(timer);roundToken++;running=false;paused=false;locked=true;pauseButton.disabled=true;falling?.remove();const passed=lives>0;document.querySelector('#finish-icon').textContent=passed?'🏆':'🌱';document.querySelector('#finish-title').textContent=passed?'挑战完成！':'继续加油！';document.querySelector('#result').innerHTML=`你接对了 <strong>${score/10}</strong> 个汉字，获得 <strong>${score}</strong> 分。可以切换另一种篮子提示再试一次。`;document.querySelector('#finish').hidden=false}
    document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b===button));if(options.length&&!locked)renderBaskets()}));startButton.addEventListener('click',start);pauseButton.addEventListener('click',togglePause);document.querySelector('#restart').addEventListener('click',start);if(previewMode){start();setTimeout(togglePause,350)}else update();
  </script>
</body></html>
