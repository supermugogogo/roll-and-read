<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>学校科目骰子闯关 · Read and Roll</title>
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('preview')</script>
  <style>
    :root{--ink:#173052;--coral:#f17c67;--cream:#fffaf1;--blue:#dff2ff;--yellow:#fff0a8;--green:#dff2c8;--pink:#f9dbe6;--purple:#e9e0fa}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:"Microsoft YaHei",system-ui,sans-serif}.shell{width:min(1080px,calc(100% - 32px));margin:auto;padding:25px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.back{color:#68788c;text-decoration:none;font-size:14px}.score{display:flex;gap:10px}.badge{padding:8px 13px;border-radius:999px;background:#fff;border:1px solid #e3ddd1;font-size:13px;font-weight:700}.hero{display:grid;grid-template-columns:1fr auto;gap:25px;align-items:center;margin-bottom:22px}.eyebrow{margin:0 0 7px;color:var(--coral);font-size:11px;font-weight:800;letter-spacing:.18em}.hero h1{margin:0;font-size:clamp(30px,5vw,52px);letter-spacing:-.04em}.hero p{margin:10px 0 0;color:#68788c;line-height:1.7}.dice-area{text-align:center}.dice{display:grid;place-items:center;width:92px;height:92px;border:0;border-radius:22px;color:var(--ink);background:#fff;box-shadow:0 12px 26px #25364a1c;font-size:54px;cursor:pointer;transition:.2s}.dice:hover{transform:translateY(-3px)}.dice.rolling{animation:shake .45s}.dice-label{margin-top:7px;color:var(--coral);font-size:12px;font-weight:800}@keyframes shake{25%{transform:rotate(9deg)}50%{transform:rotate(-9deg)}75%{transform:rotate(6deg)}}
    .board{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;padding:22px;border:1px solid #e4ddd2;border-radius:18px;background:#fff;box-shadow:0 16px 40px #27344112}.space{position:relative;min-height:150px;padding:12px 14px;border:2px solid transparent;border-radius:13px;background:var(--tile);transition:.25s}.space:nth-child(n+6):nth-child(-n+10){direction:rtl}.space strong,.space span{direction:ltr}.space-number{font-size:11px;font-weight:800;opacity:.55}.space-icon{display:grid;place-items:center;height:67px;margin:1px 0 3px;font-size:35px}.space-icon img{display:block;max-width:88px;max-height:66px;mix-blend-mode:multiply}.space-word{font-size:17px}.space-task{display:block;margin-top:4px;color:#657488;font-size:10px}.space.current{border-color:var(--coral);transform:translateY(-3px);box-shadow:0 8px 18px #f17c6730}.pawn{position:absolute;right:7px;bottom:5px;font-size:31px;filter:drop-shadow(0 3px 3px #0002)}
    .task-panel{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;margin-top:20px;padding:22px 24px;border:1px solid #dce7ef;border-radius:14px;background:#f1f7fb}.task-kicker{margin:0 0 5px;color:#66829a;font-size:11px;font-weight:800;letter-spacing:.13em}.task-text{margin:0;font-size:21px;line-height:1.55}.task-actions{display:flex;gap:8px}.btn{padding:12px 16px;border:1px solid #cbd9e4;border-radius:8px;color:var(--ink);background:#fff;cursor:pointer;font-weight:800}.btn.primary{border-color:var(--ink);color:#fff;background:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}.message{min-height:24px;margin:12px 2px 0;color:var(--coral);font-weight:700;text-align:center}
    .challenge{display:flex;align-items:center;gap:15px}.challenge-icon{display:grid;place-items:center;flex:0 0 78px;width:78px;height:78px;overflow:hidden;border-radius:16px;background:#fff;font-size:34px;box-shadow:0 5px 14px #17305212}.challenge-icon img{display:block;width:78px;height:78px;object-fit:cover}.challenge-copy{min-width:0}.challenge-line{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.challenge-name{font-size:21px;font-weight:900}.challenge-count{color:var(--coral);font-size:25px;font-weight:900}.word-repeat{margin-top:3px;color:#68788c;font-size:13px;font-weight:700}.space .pawn{top:4px!important;right:5px!important;bottom:auto!important;z-index:5}
    .modal{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#172f526b}.modal[hidden]{display:none}.modal-card{width:min(500px,100%);padding:30px;border-radius:18px;background:#fff;text-align:center;box-shadow:0 25px 70px #0003}.modal-card h2{margin:0 0 10px;font-size:30px}.modal-card p{color:#68788c;line-height:1.75}.modal-card .btn{margin-top:8px}.stars{font-size:38px;letter-spacing:6px}@media(max-width:720px){.hero{grid-template-columns:1fr}.dice-area{text-align:left}.board{grid-template-columns:repeat(2,1fr);padding:13px}.space:nth-child(n+6):nth-child(-n+10){direction:ltr}.task-panel{grid-template-columns:1fr}.task-actions{flex-wrap:wrap}.space{min-height:112px}}
    html.preview .top,html.preview .hero{display:none}html.preview .shell{width:100%;padding:12px}html.preview .board{box-shadow:none}
  </style>
  <link rel="stylesheet" href="../../game-compact.css?v=4-mobile-scroll">
</head>
<body>
  <main class="shell">
    <div class="top"><a class="back" href="../../index.html#sheet-6">← 返回学校科目详情页</a><div class="score"><span class="badge">第 <b id="round">0</b>/10 轮</span><span class="badge">已走 <b id="steps">0</b>/50 格</span></div></div>
    <section class="hero"><div><p class="eyebrow">ROLL AND READ · MINI GAME</p><h1>学校科目骰子闯关</h1><p>15张词卡随机错开排列。10轮覆盖全部词语，5种动作各出现2次，累计移动50格！</p></div><div class="dice-area"><button class="dice" id="dice" aria-label="掷骰子">⚄</button><div class="dice-label">点击随机移动</div></div></section>
    <section class="board" id="board" aria-label="闯关棋盘"></section>
    <section class="task-panel"><div class="challenge"><div class="challenge-icon"><span id="challenge-emoji">🎲</span><img id="challenge-gif" alt="动作示范" hidden></div><div class="challenge-copy"><p class="task-kicker" id="task-kind">等待本轮挑战</p><div class="challenge-line"><span class="challenge-name" id="challenge-name">点击骰子开始</span><span class="challenge-count" id="challenge-count"></span></div><div class="word-repeat" id="word-repeat">棋子会随机走过上下左右相邻的词卡格。</div></div></div><div class="task-actions"><button class="btn" id="listen" disabled>🔊 听词语</button><button class="btn primary" id="complete" disabled>完成本轮 ✓</button></div></section>
    <p class="message" id="message" aria-live="polite"></p>
  </main>
  <div class="modal" id="finish" hidden><div class="modal-card"><div class="stars">⭐⭐⭐</div><h2>50格挑战完成！</h2><p>你完成了10轮挑战，练习了全部词语，而且5种动作各完成2次！</p><button class="btn primary" id="restart">再玩一次</button></div></div>
  <script>
    const vocabulary=[["数学","game-icons/math.png?v=20260906-random-dice-v1"],["社会学","game-icons/social.png?v=20260906-random-dice-v1"],["写作","game-icons/writing.png?v=20260906-random-dice-v1"],["体育","game-icons/pe.png?v=20260906-random-dice-v1"],["科学","game-icons/science.png?v=20260906-random-dice-v1"],["图书馆","game-icons/library.png?v=20260906-random-dice-v1"],["美术","game-icons/art.png?v=20260906-random-dice-v1"],["课间","game-icons/recess.png?v=20260906-random-dice-v1"]];
    const actions=[["开合跳","../04-actions/action-gifs/jumping-jacks.gif"],["深蹲","../04-actions/action-gifs/squats.gif"],["原地高抬腿","../04-actions/action-gifs/high-knees.gif"],["手臂画圈","../04-actions/action-gifs/arm-circles.gif"],["平板支撑点肩","../04-actions/action-gifs/plank-shoulder-taps.gif"]];
    const colors=['#fff0a8','#dff2ff','#dff2c8','#f9dbe6','#e9e0fa'],COLS=5,CELLS=15,ROUNDS=10,TOTAL=50;
    const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
    function makeSpaces(){
      const pool=[...vocabulary];while(pool.length<CELLS)pool.push(...shuffle(vocabulary).slice(0,Math.min(vocabulary.length,CELLS-pool.length)));
      const placed=[];function fill(remaining){if(!remaining.length)return true;const i=placed.length,left=i%COLS?placed[i-1]:null,up=i>=COLS?placed[i-COLS]:null;const candidates=shuffle([...new Set(remaining.map(x=>x[0]))]).filter(w=>w!==left?.[0]&&w!==up?.[0]);for(const word of candidates){const pick=remaining.findIndex(x=>x[0]===word),item=remaining[pick],next=remaining.slice();next.splice(pick,1);placed.push(item);if(fill(next))return true;placed.pop()}return false}fill(shuffle(pool));return placed;
    }
    function makeWordPlan(){const buckets=Array.from({length:ROUNDS},()=>[]);shuffle(vocabulary).forEach((word,i)=>buckets[i%ROUNDS].push(word));for(const bucket of buckets)if(!bucket.length)bucket.push(vocabulary[Math.floor(Math.random()*vocabulary.length)]);return buckets}
    function makeActionPlan(){const first=shuffle(actions),second=shuffle(actions);if(second[0][0]===first[4][0])second.push(second.shift());return [...first,...second]}
    function neighbors(i){const row=Math.floor(i/COLS),col=i%COLS,out=[];if(row>0)out.push(i-COLS);if(row<2)out.push(i+COLS);if(col>0)out.push(i-1);if(col<COLS-1)out.push(i+1);return out}
    const distance=(a,b)=>Math.abs(Math.floor(a/COLS)-Math.floor(b/COLS))+Math.abs(a%COLS-b%COLS);
    const reachable=(a,b,steps)=>steps>=distance(a,b)&&(steps-distance(a,b))%2===0;
    function makeMovePlan(start){
      const memo=new Set();function search(round,pos,total){if(round===ROUNDS)return total===TOTAL?[]:null;const key=`${round}|${pos}|${total}`;if(memo.has(key))return null;memo.add(key);const remain=ROUNDS-round-1;const targets=shuffle(spaces.map((x,i)=>x[0]===wordPlan[round][0][0]?i:-1).filter(i=>i>=0));for(const target of targets)for(const steps of shuffle([1,2,3,4,5,6])){const nextTotal=total+steps;if(nextTotal+remain>TOTAL||nextTotal+remain*6<TOTAL||!reachable(pos,target,steps))continue;const rest=search(round+1,target,nextTotal);if(rest)return[{target,steps},...rest]}return null}return search(0,start,0)
    }
    function randomPath(start,target,steps){if(!steps)return[];const choices=shuffle(neighbors(start)).filter(next=>reachable(next,target,steps-1));const next=choices[0];return[next,...randomPath(next,target,steps-1)]}
    let spaces,wordPlan,actionPlan,movePlan,pos,round,totalSteps,busy,pending,currentWords;
    const board=document.querySelector('#board'),dice=document.querySelector('#dice'),taskKind=document.querySelector('#task-kind'),complete=document.querySelector('#complete'),listen=document.querySelector('#listen'),message=document.querySelector('#message'),challengeEmoji=document.querySelector('#challenge-emoji'),challengeGif=document.querySelector('#challenge-gif'),challengeName=document.querySelector('#challenge-name'),challengeCount=document.querySelector('#challenge-count'),wordRepeat=document.querySelector('#word-repeat');
    function prepare(){for(let attempt=0;attempt<80;attempt++){spaces=makeSpaces();wordPlan=makeWordPlan();actionPlan=makeActionPlan();pos=Math.floor(Math.random()*CELLS);movePlan=makeMovePlan(pos);if(movePlan)break}if(!movePlan)throw new Error('无法生成覆盖全部词语的50步路线');round=0;totalSteps=0;busy=false;pending=false;currentWords=[]}
    function drawBoard(){board.innerHTML=spaces.map((s,i)=>`<div class="space${i===pos?' current':''}" style="--tile:${colors[i%5]}"><span class="space-number">${i+1}</span><span class="space-icon"><img src="${s[1]}" alt="${s[0]}"></span><strong class="space-word">${s[0]}</strong>${i===pos?'<span class="pawn">🐼</span>':''}</div>`).join('')}
    function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.76;speechSynthesis.speak(u)}
    function render(){document.querySelectorAll('.space').forEach((el,i)=>{el.classList.toggle('current',i===pos);el.querySelector('.pawn')?.remove();if(i===pos)el.insertAdjacentHTML('beforeend','<span class="pawn">🐼</span>')});document.querySelector('#round').textContent=round;document.querySelector('#steps').textContent=totalSteps}
    function setChallenge(){const [name,gif]=actionPlan[round-1],count=3+Math.floor(Math.random()*6);currentWords=wordPlan[round-1];challengeEmoji.hidden=true;challengeGif.hidden=false;challengeGif.src=`${gif}?round=${round}`;challengeGif.alt=`${name}动作示范`;challengeName.textContent=name;challengeCount.textContent=`× ${count}`;const labels=currentWords.map(x=>x[0]);taskKind.textContent=labels.length>1?`落脚词语：${labels[0]}　加练：${labels.slice(1).join('、')}`:`落脚词语：${labels[0]}`;wordRepeat.textContent=`完成动作，同时把${labels.map(x=>'“'+x[0]+'”').join('和')}各说 ${count}次。`}
    async function roll(){if(busy||pending||round>=ROUNDS)return;busy=true;message.textContent='';dice.classList.add('rolling');const plan=movePlan[round],value=plan.steps;for(let i=0;i<8;i++){dice.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];await new Promise(r=>setTimeout(r,55))}dice.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][value-1];dice.classList.remove('rolling');for(const next of randomPath(pos,plan.target,value)){pos=next;totalSteps++;render();await new Promise(r=>setTimeout(r,190))}round++;render();setChallenge();busy=false;pending=true;complete.disabled=false;listen.disabled=false;message.textContent=`本轮随机移动 ${value} 格。完成动作和朗读后继续。`}
    dice.addEventListener('click',roll);listen.addEventListener('click',()=>speak(currentWords.map(x=>x[0]).join('，')));complete.addEventListener('click',()=>{if(!pending)return;pending=false;complete.disabled=true;listen.disabled=true;if(round===ROUNDS){message.textContent='10轮完成：全部词语都已练习，5种动作各完成2次！';speak('挑战完成');document.querySelector('#finish').hidden=false}else{message.textContent=`第${round}轮完成！继续点击骰子。`;speak('太棒了')}});
    document.querySelector('#restart').addEventListener('click',()=>{prepare();drawBoard();render();challengeGif.hidden=true;challengeGif.removeAttribute('src');challengeEmoji.hidden=false;challengeEmoji.textContent='🎲';challengeName.textContent='点击骰子开始';challengeCount.textContent='';taskKind.textContent='等待本轮挑战';wordRepeat.textContent='10轮会覆盖全部词语，5种动作各出现2次。';message.textContent='';dice.textContent='⚄';complete.disabled=true;listen.disabled=true;document.querySelector('#finish').hidden=true});
    prepare();drawBoard();render();
  </script>
</body>
</html>
