<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>房间与家具听音选词 · Read and Roll</title>
  <script>if(new URLSearchParams(location.search).has('preview'))document.documentElement.classList.add('preview')</script>
  <style>
    :root{--ink:#173052;--coral:#f17c67;--paper:#fffaf1;--blue:#e9f6ff;--green:#dff2c8;--red:#ffe1df;--muted:#68788c}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Microsoft YaHei",system-ui,sans-serif}.shell{width:min(900px,calc(100% - 32px));margin:auto;padding:25px 0 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.back{color:var(--muted);text-decoration:none;font-size:14px}.status{display:flex;gap:9px}.badge{padding:8px 13px;border:1px solid #e3ddd1;border-radius:999px;background:#fff;font-size:13px;font-weight:700}.hero{margin:32px 0 22px;text-align:center}.eyebrow{margin:0 0 8px;color:var(--coral);font-size:11px;font-weight:800;letter-spacing:.18em}.hero h1{margin:0;font-size:clamp(32px,5vw,52px);letter-spacing:-.04em}.hero p{margin:10px 0 0;color:var(--muted);line-height:1.7}.game{padding:28px;border:1px solid #dce7ef;border-radius:20px;background:#fff;box-shadow:0 18px 46px #27344112}.progress{height:8px;overflow:hidden;border-radius:99px;background:#edf0f3}.progress span{display:block;width:10%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#f17c67,#ffc36d);transition:width .3s}.prompt{text-align:center;padding:31px 0 24px}.speaker{display:grid;place-items:center;width:112px;height:112px;margin:auto;border:0;border-radius:50%;color:#fff;background:var(--ink);cursor:pointer;font-size:44px;box-shadow:0 13px 30px #17305236;transition:.2s}.speaker:hover{transform:scale(1.04)}.speaker.speaking{animation:pulse .8s infinite alternate}.prompt h2{margin:17px 0 4px;font-size:23px}.prompt p{margin:0;color:var(--muted);font-size:13px}@keyframes pulse{to{box-shadow:0 0 0 13px #dceafb}}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.choice{position:relative;min-width:0;padding:15px;border:2px solid #e1e6eb;border-radius:14px;color:var(--ink);background:#fff;cursor:pointer;transition:.2s}.choice:hover{border-color:#9eb8ce;transform:translateY(-2px)}.choice img{display:block;width:100%;height:135px;object-fit:contain;mix-blend-mode:multiply}.choice strong{display:block;margin-top:8px;font-size:22px}.choice.correct{border-color:#77b844;background:#f3faec}.choice.wrong{border-color:#e87b72;background:#fff3f2}.choice:disabled{cursor:default}.feedback{min-height:55px;margin-top:18px;padding:14px;border-radius:10px;color:var(--muted);background:#f5f7f8;text-align:center;font-weight:700}.feedback.good{color:#3e7624;background:#f0f9e8}.feedback.bad{color:#a54942;background:#fff0ee}.next{display:block;margin:16px auto 0;padding:13px 24px;border:0;border-radius:9px;color:#fff;background:var(--ink);cursor:pointer;font-weight:800}.next[hidden]{display:none}.modal{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#172f526b}.modal[hidden]{display:none}.modal-card{width:min(480px,100%);padding:31px;border-radius:20px;background:#fff;text-align:center}.modal-card .trophy{font-size:55px}.modal-card h2{margin:6px 0;font-size:30px}.modal-card p{color:var(--muted);line-height:1.7}.modal-card button{padding:13px 22px;border:0;border-radius:9px;color:#fff;background:var(--ink);cursor:pointer;font-weight:800}@media(max-width:650px){.game{padding:18px}.choices{grid-template-columns:1fr}.choice{display:grid;grid-template-columns:105px 1fr;align-items:center;text-align:left}.choice img{height:90px}.choice strong{margin:0;font-size:20px}.status{gap:5px}.badge{padding:7px 9px}}
    html.preview .top,html.preview .hero{display:none}html.preview .shell{width:100%;padding:12px}html.preview .game{box-shadow:none}
  </style>
  <link rel="stylesheet" href="../../game-compact.css?v=2">
</head>
<body>
  <main class="shell">
    <div class="top"><a class="back" href="../../index.html#sheet-8">← 返回日常活动详情页</a><div class="status"><span class="badge">得分 <b id="score">0</b></span><span class="badge">连续答对 <b id="streak">0</b></span></div></div>
    <header class="hero"><p class="eyebrow">LISTEN AND CHOOSE</p><h1>房间与家具听音选词</h1><p>仔细听中文发音，从三张卡片中选出正确的词语。</p></header>
    <section class="game"><div class="progress"><span id="progress"></span></div><div class="prompt"><button class="speaker" id="speaker" aria-label="播放词语">🔊</button><h2>听一听，选一选</h2><p>没有听清楚？可以重复播放。</p></div><div class="choices" id="choices"></div><div class="feedback" id="feedback">点击喇叭播放第一个词语。</div><button class="next" id="next" hidden>下一题 →</button></section>
  </main>
  <div class="modal" id="finish" hidden><div class="modal-card"><div class="trophy">🏆</div><h2>听音挑战完成！</h2><p id="result"></p><button id="restart">再玩一次</button></div></div>
  <script>
    const words=[
      {word:"房间",pinyin:"fáng jiān",img:"game-icons/room.png"},{word:"客厅",pinyin:"kè tīng",img:"game-icons/living.png"},{word:"卧室",pinyin:"wò shì",img:"game-icons/bedroom.png"},{word:"厨房",pinyin:"chú fáng",img:"game-icons/kitchen.png"},{word:"卫生间",pinyin:"wèi shēng jiān",img:"game-icons/bathroom.png"},{word:"沙发",pinyin:"shā fā",img:"game-icons/sofa.png"},{word:"床",pinyin:"chuáng",img:"game-icons/bed.png"},{word:"书架",pinyin:"shū jià",img:"game-icons/shelf.png"},{word:"衣柜",pinyin:"yī guì",img:"game-icons/wardrobe.png"},{word:"玩具",pinyin:"wán jù",img:"game-icons/toy.png"}
    ];
    const previewMode=new URLSearchParams(location.search).has('preview');let deck=[],round=0,score=0,streak=0,answered=false,current=null;const choices=document.querySelector('#choices'),feedback=document.querySelector('#feedback'),speaker=document.querySelector('#speaker'),next=document.querySelector('#next');
    const shuffle=a=>[...a].sort(()=>Math.random()-.5);
    function speak(text){if(previewMode||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.72;speaker.classList.add('speaking');u.onend=()=>speaker.classList.remove('speaking');u.onerror=()=>speaker.classList.remove('speaking');speechSynthesis.speak(u)}
    function start(){deck=shuffle(words).slice(0,10);round=0;score=0;streak=0;document.querySelector('#finish').hidden=true;showRound()}
    function showRound(){answered=false;current=deck[round];const wrong=shuffle(words.filter(x=>x.word!==current.word)).slice(0,2);const options=shuffle([current,...wrong]);choices.innerHTML=options.map(x=>`<button class="choice" data-word="${x.word}"><img src="${x.img}" alt=""><strong>${x.word}</strong></button>`).join('');choices.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>answer(button)));feedback.className='feedback';feedback.textContent='播放语音，然后选择正确的词语。';next.hidden=true;document.querySelector('#progress').style.width=`${(round+1)*10}%`;update();setTimeout(()=>speak(current.word),250)}
    function answer(button){if(answered)return;answered=true;const right=button.dataset.word===current.word;choices.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.word===current.word)b.classList.add('correct')});if(right){score+=10;streak++;feedback.className='feedback good';feedback.textContent=`答对了！“${current.word}”读得真清楚。`;speak('答对了，'+current.word)}else{streak=0;button.classList.add('wrong');feedback.className='feedback bad';feedback.textContent=`再听一次：正确答案是“${current.word}”。`;speak('正确答案是，'+current.word)}update();next.hidden=false;next.textContent=round===deck.length-1?'查看成绩 →':'下一题 →'}
    function update(){document.querySelector('#score').textContent=score;document.querySelector('#streak').textContent=streak}
    function advance(){if(round<deck.length-1){round++;showRound()}else{document.querySelector('#result').innerHTML=`你答对了 <strong>${score/10}</strong> 道题，获得 <strong>${score}</strong> 分。`;document.querySelector('#finish').hidden=false}}
    speaker.addEventListener('click',()=>speak(current.word));next.addEventListener('click',advance);document.querySelector('#restart').addEventListener('click',start);start();
  </script>
</body>
</html>
