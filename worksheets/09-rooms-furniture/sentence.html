<style>:root{--ink:#173052;--coral:#f17c67;--paper:#fffaf1;--muted:#68788c;--green:#edf8e5;--red:#fff0ee}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Microsoft YaHei",system-ui,sans-serif}.shell{width:min(980px,calc(100% - 32px));margin:auto;padding:25px 0 50px}.top{display:flex;justify-content:space-between;align-items:center}.back{color:var(--muted);text-decoration:none;font-size:14px}.badge{padding:8px 13px;border:1px solid #e3ddd1;border-radius:999px;background:#fff;font-size:13px;font-weight:700}.hero{text-align:center;margin:24px 0 18px}.eyebrow{margin:0 0 7px;color:var(--coral);font-size:11px;font-weight:800;letter-spacing:.18em}.hero h1{margin:0;font-size:clamp(31px,5vw,48px)}.hero p{margin:8px 0;color:var(--muted)}.game{display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:25px;padding:27px;border:1px solid #e4ddd2;border-radius:20px;background:#fff;box-shadow:0 18px 46px #27344112}.picture{position:relative;display:grid;place-items:center;min-height:410px;padding:18px;border-radius:15px;background:linear-gradient(145deg,#eff8ff,#fff9e9)}.picture img{width:100%;height:330px;object-fit:contain;mix-blend-mode:multiply}.scene-cue{position:absolute;left:16px;right:16px;bottom:14px;padding:9px 12px;border:2px solid #78aee0;border-radius:14px;background:#fffffff2;color:#173052;text-align:center;font-size:20px;font-weight:800}.scene-cue:empty{display:none}.work{display:flex;flex-direction:column}.round{color:var(--coral);font-size:12px;font-weight:800;letter-spacing:.1em}.work h2{margin:7px 0 5px;font-size:25px}.hint{margin:0 0 16px;color:var(--muted);font-size:13px}.answers{display:grid;gap:11px}.answer{display:grid;grid-template-columns:42px 1fr 46px;align-items:center;min-height:67px;border:2px solid #d7e0e7;border-radius:13px;background:#fff;overflow:hidden;transition:.15s}.answer:hover{border-color:#8cb6d7;transform:translateY(-1px)}.answer.selected{border-color:#397bb2;background:#eef8ff}.answer.correct{border-color:#63a94e;background:var(--green)}.answer.wrong{border-color:#dd746b;background:var(--red)}.pick,.speak{height:100%;border:0;background:transparent;cursor:pointer}.pick{font-size:18px;font-weight:900;color:#397bb2}.sentence-text{padding:12px 4px;font-size:19px;font-weight:700;line-height:1.55;cursor:pointer}.speak{border-left:1px solid #e5eaee;font-size:21px}.speak:hover{background:#f3f8fc}.controls{display:flex;gap:9px;margin-top:auto;padding-top:18px}.btn{padding:12px 17px;border:1px solid #cbd6df;border-radius:9px;background:#fff;color:var(--ink);cursor:pointer;font-weight:800}.btn.primary{border-color:var(--ink);color:#fff;background:var(--ink)}.btn:disabled{opacity:.4}.feedback{min-height:53px;margin-top:13px;padding:12px;border-radius:9px;background:#f5f7f8;color:var(--muted);font-size:13px;font-weight:700;line-height:1.7}.feedback.good{color:#417829;background:var(--green)}.feedback.bad{color:#a64c44;background:var(--red)}.progress{height:7px;margin-top:17px;overflow:hidden;border-radius:99px;background:#edf0f2}.progress span{display:block;height:100%;background:linear-gradient(90deg,#f17c67,#ffc36d)}.modal{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:#172f526b}.modal[hidden]{display:none}.modal-card{width:min(480px,100%);padding:32px;border-radius:20px;background:#fff;text-align:center}.modal-card div{font-size:54px}.modal-card h2{margin:7px 0;font-size:30px}.modal-card button{padding:13px 22px;border:0;border-radius:9px;color:#fff;background:var(--ink);cursor:pointer;font-weight:800}@media(max-width:760px){.game{grid-template-columns:1fr;padding:18px}.picture{min-height:230px}.picture img{height:205px}.sentence-text{font-size:17px}}html.preview .top,html.preview .hero{display:none}html.preview .shell{width:100%;padding:12px}html.preview .game{box-shadow:none}</style><link rel="stylesheet" href="../../game-compact.css?v=3"></head>

<script>const V='?v=20260908-location-sentence-v1';const questions=[{"img":"game-icons/room.png","correct":"这是一个房间。","wrong":["这是一张床。","这是一个书架。"],"tip":"图中是一个有窗户和家具的完整房间。"},{"img":"game-icons/living.png","correct":"客厅里有一张沙发。","wrong":["厨房里有一张沙发。","卫生间里有一张沙发。"],"tip":"沙发和茶几组成了客厅场景。"},{"img":"game-icons/bedroom.png","correct":"卧室里有一张床。","wrong":["客厅里有一张床。","厨房里有一张床。"],"tip":"画面中有床和床头柜，这是卧室。"},{"img":"game-icons/kitchen.png","correct":"厨房里有冰箱和炉子。","wrong":["卧室里有冰箱和炉子。","卫生间里有冰箱和炉子。"],"tip":"冰箱、炉子和水槽都在厨房里。"},{"img":"game-icons/bathroom.png","correct":"卫生间里有马桶和淋浴间。","wrong":["卧室里有马桶和淋浴间。","客厅里有马桶和淋浴间。"],"tip":"马桶、洗手池和淋浴间表示卫生间。"},{"img":"game-icons/sofa.png","correct":"这是一张绿色的沙发。","wrong":["这是一张绿色的床。","这是一个绿色的衣柜。"],"tip":"图中是一张带靠背和扶手的绿色沙发。"},{"img":"game-icons/bed.png","correct":"这是一张蓝色的床。","wrong":["这是一张蓝色的沙发。","这是一个蓝色的书架。"],"tip":"图中是一张铺着蓝色被子的床。"},{"img":"game-icons/shelf.png","correct":"书架上有很多书。","wrong":["衣柜里有很多书。","床上有很多书。"],"tip":"多层书架上整齐摆着许多书。"},{"img":"game-icons/wardrobe.png","correct":"衣柜里挂着衣服。","wrong":["书架里挂着衣服。","冰箱里挂着衣服。"],"tip":"打开的衣柜里可以看到几件衣服。"},{"img":"game-icons/toy.png","correct":"这里有小熊和玩具车。","wrong":["这里有冰箱和电脑。","这里有床和沙发。"],"tip":"图中有玩具熊、积木和玩具车。"}];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);let deck=[],index=0,selected=-1,score=0,locked=false;const picture=document.querySelector('#picture'),answers=document.querySelector('#answers'),feedback=document.querySelector('#feedback'),check=document.querySelector('#check'),next=document.querySelector('#next');function stopVoice(){if('speechSynthesis'in window)speechSynthesis.cancel()}function speak(text){if(!('speechSynthesis'in window))return;stopVoice();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=.72;speechSynthesis.speak(u)}function start(){stopVoice();deck=shuffle(questions);index=0;score=0;document.querySelector('#finish').hidden=true;show()}function show(){stopVoice();selected=-1;locked=false;const q=deck[index];q.options=shuffle([q.correct,...q.wrong]);picture.src=q.img;document.querySelector('#sceneCue').textContent=q.cue||'';document.querySelector('#round').textContent=`第 ${index+1} / ${deck.length} 题`;document.querySelector('#score').textContent=score;document.querySelector('#progress').style.width=`${(index+1)/deck.length*100}%`;answers.innerHTML=q.options.map((text,i)=>`<div class="answer" data-i="${i}"><button class="pick" aria-label="选择第${i+1}句">${String.fromCharCode(65+i)}</button><span class="sentence-text">${text}</span><button class="speak" aria-label="朗读句子">🔊</button></div>`).join('');answers.querySelectorAll('.answer').forEach(row=>{const choose=()=>select(Number(row.dataset.i));row.querySelector('.pick').onclick=choose;row.querySelector('.sentence-text').onclick=choose;row.querySelector('.speak').onclick=e=>{e.stopPropagation();speak(q.options[Number(row.dataset.i)])}});feedback.className='feedback';feedback.textContent='先观察图片，再选择最合适的句子。';check.disabled=true;check.hidden=false;next.hidden=true}function select(i){if(locked)return;selected=i;answers.querySelectorAll('.answer').forEach((row,n)=>row.classList.toggle('selected',n===i));check.disabled=false;feedback.className='feedback';feedback.textContent='已经选好了吗？点击“确定答案”看看吧！'}function checkAnswer(){if(selected<0||locked)return;locked=true;const q=deck[index],rows=[...answers.querySelectorAll('.answer')],right=q.options.indexOf(q.correct);rows[right].classList.add('correct');if(selected===right){score++;document.querySelector('#score').textContent=score;feedback.className='feedback good';feedback.textContent=`答对了！${q.tip}`;speak(q.correct)}else{rows[selected].classList.add('wrong');feedback.className='feedback bad';feedback.textContent=`再仔细观察：${q.tip} 正确句子是“${q.correct}”`;}check.hidden=true;next.hidden=false;next.textContent=index===deck.length-1?'查看成绩 →':'下一题 →'}check.onclick=checkAnswer;next.onclick=()=>{if(index<deck.length-1){index++;show()}else{stopVoice();document.querySelector('#result').innerHTML=`你找对了 <strong>${score}</strong> 个句子，共获得 <strong>${score}</strong> 颗星！`;document.querySelector('#finish').hidden=false}};document.querySelector('#restart').onclick=start;start();</script></body></html>
